gitignore: true
ignores:
  - archive_DO_NOT_COMMIT/**
  - .agents/**
  - .beads/**
  - .claude/**
  - .codex/**
  - .cursor/**
config:
  default: true
  MD003: { style: atx }
  MD004: { style: dash }
  MD007: { indent: 2 }
  MD013: false
  MD024: { siblings_only: false }
  MD025: true
  MD029: { style: ordered }
  MD033: true
  MD035: { style: "---" }
  MD041: true
  MD046: { style: fenced }
  MD048: { style: backtick }
  MD049: { style: underscore }
  MD050: { style: asterisk }
  MD055: { style: leading_and_trailing }
  MD044:
    code_blocks: false
    html_elements: false
    names: [GitHub, GitHub Actions, TypeScript, JavaScript, Python, FastAPI, Pipecat, React, Vite, Markdown, Docker, Home Assistant, OpenRouter, Gemini]
