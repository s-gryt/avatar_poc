id: no-comments-python
language: python
severity: error
message: Comments are banned.
rule:
  kind: comment
---
id: no-docstrings-python
language: python
severity: error
message: Docstrings and bare string statements are banned.
rule:
  kind: string
  inside:
    kind: expression_statement
---
id: no-comments-bash
language: bash
severity: error
message: Comments are banned. Only a shebang on line 1 of a .sh file is allowed.
rule:
  kind: comment
  not:
    all:
      - regex: "^#!"
      - nthChild: 1
---
